[project]
name = "crewai-research-assistant"
version = "0.1.0"
description = "A two-agent CrewAI research assistant using Exa web search and OpenAI models, prepared for AMP deployment"
authors = [{ name = "Taha Mohammed", email = "mataha@ualr.edu" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.15.32,<2.0.0",
    "exa-py>=2,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
crewai_research_assistant = "crewai_research_assistant.main:run"
run_crew = "crewai_research_assistant.main:run"
run_with_trigger = "crewai_research_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_research_assistant"]

[tool.crewai]
type = "crew"
